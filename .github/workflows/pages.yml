name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore RailGo cache
        uses: actions/cache@v4
        with:
          path: .cache/railgo
          key: railgo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            railgo-${{ runner.os }}-

      - name: Run checks
        run: pnpm check

      - name: Refresh RailGo snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm data:update

      - name: Require a live RailGo snapshot
        run: pnpm data:validate

      - name: Build website
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
